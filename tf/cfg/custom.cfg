//tweaks and custom settings
//Made with cfg.tf - custom Team Fortress 2 config generator

exec tweaks/null
exec tweaks/confilter
///---

//bhop
alias bhopjumping "+jump;wait 1;-jump;wait 1;bhoploop"
alias bhopalias "alias bhoploop bhopjumping"
alias bhopstop "alias bhoploop"
alias +bunnyhop "bhopalias;bhopjumping"
alias -bunnyhop "bhopstop;-jump"
bind SPACE +bunnyhop

net_graph 1

// Disable ragdolls
cl_ragdoll_fade_time 0
cl_ragdoll_forcefade 1
cl_ragdoll_physics_enable 0
g_ragdoll_fadespeed 0
g_ragdoll_lvfadespeed 0
ragdoll_sleepaftertime 0

// Disable gibs
cl_phys_props_enable 0
cl_phys_props_max 0
props_break_max_pieces 0
r_propsmaxdist 1
violence_agibs 0
violence_hgibs 0

glow_outline_effect_enable 0
snd_mute_losefocus 0
cl_crosshair_file crosshair7
cl_crosshair_scale 21

voice_buffer_ms 200